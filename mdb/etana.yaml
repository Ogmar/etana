# Etana mission database. Defines telemetry packet structure.
# Encoded by flight software, decoded by ground segment. See README.md.
# Multi-byte fields are big-endian.

mission:
  name: "Etana"
  vehicle: "Eagle-1"
  description: "Etana high-altitude balloon telemetry mission database"
  byte_order: big_endian
  ccsds:
    version: 0
    sequence_flags: 3       # unsegmented

# Reusable value encodings, referenced by parameters.
parameter_types:

  uint8:   { encoding: unsigned_int, size_bits: 8 }
  uint16:  { encoding: unsigned_int, size_bits: 16 }
  uint32:  { encoding: unsigned_int, size_bits: 32 }
  int16:   { encoding: signed_int,   size_bits: 16 }

  # Degrees encoded as signed int32 scaled by 1e7.
  latlon_deg:
    encoding: signed_int
    size_bits: 32
    unit: "deg"
    calibrator:
      type: polynomial
      coefficients: [0.0, 1.0e-7]

  altitude_m:
    encoding: unsigned_int
    size_bits: 16
    unit: "m"

  # Raw ADC counts. Coefficients are placeholders pending sensor calibration.
  ozone_counts:
    encoding: unsigned_int
    size_bits: 16
    unit: "ppb"
    calibrator:
      type: polynomial
      coefficients: [-12.5, 0.0488]

  # Raw ADC counts. Coefficients are placeholders pending sensor calibration.
  co2_counts:
    encoding: unsigned_int
    size_bits: 16
    unit: "ppm"
    calibrator:
      type: polynomial
      coefficients: [0.0, 0.61]

  battery_mv:
    encoding: unsigned_int
    size_bits: 16
    unit: "V"
    calibrator:
      type: polynomial
      coefficients: [0.0, 0.001]

  # Signed centi-degrees C.
  temp_cdeg:
    encoding: signed_int
    size_bits: 16
    unit: "degC"
    calibrator:
      type: polynomial
      coefficients: [0.0, 0.01]

  fix_quality:
    encoding: unsigned_int
    size_bits: 8
    enumeration:
      0: "no_fix"
      1: "2d_fix"
      2: "3d_fix"
      3: "dgps_fix"

  event_code:
    encoding: unsigned_int
    size_bits: 8
    enumeration:
      1: "launch_detected"
      2: "burst_detected"
      3: "descent_detected"
      4: "landing_detected"
      5: "cutdown_fired"
      6: "mode_change"

# Named telemetry points, each referencing a type.
parameters:

  # GPS (APID 100)
  gps_latitude:   { type: latlon_deg,  description: "WGS84 latitude"  }
  gps_longitude:  { type: latlon_deg,  description: "WGS84 longitude" }
  gps_altitude:   { type: altitude_m,  description: "GPS altitude MSL" }
  gps_fix:        { type: fix_quality, description: "Fix quality" }
  gps_sats:       { type: uint8,       description: "Satellites in view" }

  # Payload (APID 200)
  ozone_raw:      { type: ozone_counts, description: "Ozone cell ADC counts" }
  co2_raw:        { type: co2_counts,   description: "CO2 sensor ADC counts" }
  payload_temp:   { type: temp_cdeg,    description: "Payload internal temp" }

  # Housekeeping (APID 300)
  battery:        { type: battery_mv,   description: "Main battery voltage" }
  temp_internal:  { type: temp_cdeg,    description: "Avionics bay temp" }
  temp_external:  { type: temp_cdeg,    description: "Outside air temp" }
  uptime_s:       { type: uint32,       description: "Seconds since boot" }
  last_rssi:      { type: int16,        description: "Last uplink RSSI (if any)" }

  # Events (APID 400)
  event:          { type: event_code,   description: "Flight event that occurred" }

# One container per APID. Fields are in on-wire order.
# onboard_time: spacecraft-clock time of sample. Earth-receive time is set ground-side.
# apid: CCSDS Application Process Identifier. rate_hz: nominal downlink cadence.
containers:

  gps:
    apid: 100
    rate_hz: 1.0
    description: "GPS position and fix status"
    fields:
      - { name: onboard_time, type: uint32, description: "Onboard time, seconds" }
      - { parameter: gps_latitude }
      - { parameter: gps_longitude }
      - { parameter: gps_altitude }
      - { parameter: gps_fix }
      - { parameter: gps_sats }

  payload:
    apid: 200
    rate_hz: 0.2
    description: "Atmospheric science payload"
    fields:
      - { name: onboard_time, type: uint32 }
      - { parameter: ozone_raw }
      - { parameter: co2_raw }
      - { parameter: payload_temp }

  housekeeping:
    apid: 300
    rate_hz: 0.1
    description: "Vehicle health and status"
    fields:
      - { name: onboard_time, type: uint32 }
      - { parameter: battery }
      - { parameter: temp_internal }
      - { parameter: temp_external }
      - { parameter: uptime_s }
      - { parameter: last_rssi }

  events:
    apid: 400
    rate_hz: 0.0
    description: "Discrete flight events"
    fields:
      - { name: onboard_time, type: uint32 }
      - { parameter: event }
