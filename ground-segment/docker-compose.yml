# Postgres for the Etana archive. The Python services run directly on the host;
# only the database is containerized. Bring it up with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: etana-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etana}
      POSTGRES_USER: ${POSTGRES_USER:-etana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etana}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - etana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etana} -d ${POSTGRES_DB:-etana}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  etana_pgdata:
