[project]
name = "etana-api"
version = "0.1.0"
description = "Etana ground-segment archive and API (Django)"
requires-python = ">=3.10"
dependencies = ["django>=5.0", "djangorestframework>=3.14", "psycopg[binary]>=3.1", "python-dotenv>=1.0", "etana-ccsds"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "telemetry*"]
