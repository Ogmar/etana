[project]
name = "etana-ingestion"
version = "0.1.0"
description = "Etana telemetry ingestion: packet sources and pipeline"
requires-python = ">=3.10"
dependencies = ["etana-ccsds"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]
