name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ccsds:
    name: CCSDS codec tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground-segment/packages/ccsds
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  ingestion:
    name: Ingestion tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ccsds and ingestion with dev dependencies
        run: |
          pip install -e ground-segment/packages/ccsds
          pip install -e "ground-segment/services/ingestion[dev]"

      - name: Run tests
        working-directory: ground-segment/services/ingestion
        run: pytest -v

  simulator:
    name: Simulator tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ccsds and simulator with dev dependencies
        run: |
          pip install -e ground-segment/packages/ccsds
          pip install -e "ground-segment/services/simulator[dev]"

      - name: Run tests
        working-directory: ground-segment/services/simulator
        run: pytest -v
